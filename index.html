<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <link rel="stylesheet" href="music.css">
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>MyMusic</h2>
    <ul>
      <li>Home</li>
      <li>Search</li>
      <li>Your Library</li>
    </ul>
  </div>

  <div class="main">
    <div class="header">
      <h1>Discover</h1>
      <input type="text" id="searchBox" placeholder="Search songs...">
    </div>

    <div class="grid" id="songGrid"></div>
  </div>
</div>

<div class="player">
  <div id="nowPlaying">Select a song</div>

  <div class="controls">
    <button onclick="prevTrack()">⏮</button>
    <button onclick="playPause()">▶</button>
    <button onclick="nextTrack()">⏭</button>
  </div>

  <input type="range" id="progress">
</div>

<audio id="audio"></audio>

<script src="music.js"></script>
</body>
</html>
